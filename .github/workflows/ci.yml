name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LOCAL_IMAGE: vortex-mec-frontend
  HUB_IMAGE: oliveiraclaudio/vortex-mec-frontend
  SMOKE_NAME: vortex-mec-frontend-ci
  SMOKE_PORT: '8088'

jobs:
  quality:
    name: Lint & Build
    runs-on: [self-hosted, vortex-mec-frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Oxlint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ''

  docker:
    name: Docker
    runs-on: [self-hosted, vortex-mec-frontend]
    needs: quality
    environment: DOCKERHUB
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            --tag "${LOCAL_IMAGE}:${GITHUB_SHA}" \
            --tag "${LOCAL_IMAGE}:latest" \
            .

      - name: Smoke test
        run: |
          set -euo pipefail
          docker rm -f "${SMOKE_NAME}" || true
          docker run -d --name "${SMOKE_NAME}" -p "${SMOKE_PORT}:8080" "${LOCAL_IMAGE}:${GITHUB_SHA}"
          for i in {1..15}; do
            if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/" > /dev/null; then
              echo "Container responded successfully"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to respond"
          docker logs "${SMOKE_NAME}"
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f "${SMOKE_NAME}" || true

  zap:
    name: OWASP ZAP
    runs-on: [self-hosted, vortex-mec-frontend]
    needs: docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start target
        run: |
          set -euo pipefail
          docker rm -f "${SMOKE_NAME}" || true
          docker run -d --name "${SMOKE_NAME}" -p "${SMOKE_PORT}:8080" "${LOCAL_IMAGE}:${GITHUB_SHA}"
          for i in {1..15}; do
            if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${SMOKE_NAME}"
          exit 1

      - name: Baseline scan
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP}/zap-reports"
          mkdir -p "$REPORT_DIR"
          cp .zap/rules.tsv "$REPORT_DIR/rules.tsv"
          chmod -R a+rwx "$REPORT_DIR"

          ZAP_IMAGE="ghcr.io/zaproxy/zaproxy:stable"
          if ! docker pull "$ZAP_IMAGE"; then
            echo "ghcr.io indisponível, tentando Docker Hub..."
            ZAP_IMAGE="zaproxy/zap-stable"
            docker pull "$ZAP_IMAGE"
          fi

          set +e
          docker run --rm --network host \
            -v "${REPORT_DIR}:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
              -t "http://127.0.0.1:${SMOKE_PORT}" \
              -c rules.tsv \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md
          code=$?
          set -e

          echo "ZAP exit code: ${code} (0=ok, 1=FAIL, 2=WARN, 3=erro)"
          if [ "$code" -eq 1 ] || [ "$code" -ge 3 ]; then
            exit "$code"
          fi

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: ${{ runner.temp }}/zap-reports/zap-report.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop target
        if: always()
        run: docker rm -f "${SMOKE_NAME}" || true

  trivy:
    name: Trivy
    runs-on: [self-hosted, vortex-mec-frontend]
    needs: docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Scan image
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin
          fi
          trivy image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            "${LOCAL_IMAGE}:${GITHUB_SHA}"

  publish:
    name: Publish
    runs-on: [self-hosted, vortex-mec-frontend]
    needs: [zap, trivy]
    environment: DOCKERHUB
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "${HUB_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "${HUB_IMAGE}:${SHORT_SHA}"
          docker push "${HUB_IMAGE}:latest"
          docker push "${HUB_IMAGE}:${SHORT_SHA}"

      - name: Cleanup
        if: always()
        run: docker image prune -f || true
